services:
  postgres:
    image: postgres:16
    container_name: ticketreserve-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketreserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ticketreserve-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ticketreserve-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # Trace backend (depo): uygulama span'leri OTLP ile buraya akar, saklanır. Kendi UI'ı yok, API sunar (3200).
  tempo:
    image: grafana/tempo:latest
    container_name: ticketreserve-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "4317:4317"     # OTLP gRPC (uygulama buraya trace gönderir — eskiden Jaeger'daydı)
      - "4318:4318"     # OTLP HTTP
      - "3200:3200"     # Tempo API (Grafana buraya sorar)

  # Görselleştirme UI. Tempo'yu veri kaynağı olarak önceden bağlı gelir (grafana-datasources.yaml).
  grafana:
    image: grafana/grafana:latest
    container_name: ticketreserve-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # login ekranı olmasın (local kolaylık)
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"     # Grafana UI (tarayıcı)
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml

volumes:
  postgres_data: