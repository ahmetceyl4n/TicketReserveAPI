services:
  postgres:
    image: postgres:16
    container_name: ticketreserve-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketreserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ticketreserve-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ticketreserve-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # Distributed tracing backend. Uygulama span'leri OTLP ile buraya gönderir; UI'da (16686) şelale görülür.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ticketreserve-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"   # Jaeger'ın OTLP alıcısını aç (4317 gRPC / 4318 HTTP)
    ports:
      - "16686:16686"   # Jaeger UI (tarayıcı)
      - "4317:4317"     # OTLP gRPC (uygulama buraya trace gönderir)
      - "4318:4318"     # OTLP HTTP

volumes:
  postgres_data: